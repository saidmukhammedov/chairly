services:
  - type: web
    name: chairly-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: DEFAULT_CURRENCY
        value: UZS
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://chairly.uz,https://www.chairly.uz
